<!doctype html>
<html lang="zh-CN" data-motion="reduced">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>CircuitPlatform visual regression</title></head>
  <body><div id="app"></div>
    <script type="module">
      // 截图使用真实 Vue 应用和 CircuitCanvas；此 adapter 只替代 Electron 引擎边界。
      window.addEventListener("error", (event) => {
        window.__visualError = event.error?.stack ?? event.message;
      });
      window.addEventListener("unhandledrejection", (event) => {
        window.__visualError = event.reason?.stack ?? String(event.reason);
      });
      const params = new URLSearchParams(location.search);
      const state = params.get("state") || "default";
      const parentPath = "/visual/parent.circuit.json";
      const childPath = "/visual/child.circuit.json";
      const peerPath = "/visual/peer.circuit.json";
      const longPath = "/visual/this-is-a-deliberately-long-project-file-name-for-tab-overflow.circuit.json";
      // 最近项目的条目是存储种子而非注入的 DOM：面板列表仍由真实应用从 localStorage 渲染，
      // 与 first-start 同属启动状态。种子路径即规范化形态（身份比较用的就是它）。
      // 截图器与探针在同一个会话里按序加载各状态，先清掉上一次加载的残留再按需种入，
      // 否则种子会泄漏进后续状态的画面。
      localStorage.removeItem("circuit-platform.recent-projects");
      if (state === "first-start-recent") {
        const now = Date.now();
        localStorage.setItem("circuit-platform.recent-projects", JSON.stringify([
          { path: "C:\\电路示例\\八位加法器.circuit.json", displayName: "八位加法器.circuit.json", lastUsedAt: now - 60_000 },
          { path: "C:\\电路示例\\流水灯.circuit.json", displayName: "流水灯.circuit.json", lastUsedAt: now - 3_600_000 },
        ]));
      }
      const theme = params.get("theme") === "light" ? "light" : "dark";
      const reducedMotion = params.get("motion") === "reduced";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.motion = reducedMotion ? "reduced" : "normal";
      let nextComponentId = 1;
      let nextConnectionId = 1;
      let failAdds = false;
      let tickStep = 0;
      let pendingTick = null;
      const componentKinds = new Map();
      const componentPorts = new Map();
      // 夹具扮演的就是引擎：真实引擎在 add_component 省略端口清单时回退到内置定义并把实际清单回传，
      // 这里照做。前端源码里没有第二份端口定义，位宽的唯一权威来源是引擎。
      const bit = (name, direction) => ({ name, direction, width: 1 });
      const visualPorts = {
        input: [bit("out", "output")],
        output: [bit("in", "input")],
        not: [bit("in", "input"), bit("out", "output")],
        and: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        or: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        nand: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        nor: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        xor: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        xnor: [bit("in1", "input"), bit("in2", "input"), bit("out", "output")],
        clock: [bit("out", "output")],
        d_flip_flop: [bit("d", "input"), bit("clock", "input"), bit("q", "output")],
      };
      // 层次视觉状态使用真实项目加载路径：父文件含一个 Subcircuit，子文件提供 A/Y 接口。
      // 这里仅提供夹具文本与桥接响应，不在视觉页实现解析或展平。
      const hierarchyParent = {
        version: 1,
        circuit: {
          components: [
            { id: "root-input", kind: "input", displayName: "输入 A", position: { x: 72, y: 212 }, data: { value: "0" } },
            {
              id: "alu-instance", kind: "subcircuit", displayName: "ALU 子电路", position: { x: 320, y: 160 },
              data: {
                reference: "./child.circuit.json",
                cachedPorts: [bit("A", "input"), bit("Y", "output")],
                portOrder: ["A", "Y"],
              },
            },
            { id: "root-output", kind: "output", displayName: "输出 Y", position: { x: 624, y: 212 } },
          ],
          connections: [
            { id: "root-in", source: { component: "root-input", port: "out" }, target: { component: "alu-instance", port: "A" } },
            { id: "root-out", source: { component: "alu-instance", port: "Y" }, target: { component: "root-output", port: "in" } },
          ],
        },
      };
      const hierarchyChild = {
        version: 1,
        circuit: {
          components: [
            { id: "child-input", kind: "input", displayName: "A", position: { x: 72, y: 140 }, ports: [bit("out", "output")] },
            { id: "child-not", kind: "not", displayName: "NOT 1", position: { x: 216, y: 140 }, ports: [bit("in", "input"), bit("out", "output")] },
            { id: "child-output", kind: "output", displayName: "Y", position: { x: 360, y: 140 }, ports: [bit("in", "input")] },
          ],
          connections: [
            { id: "child-wire-in", source: { component: "child-input", port: "out" }, target: { component: "child-not", port: "in" } },
            { id: "child-wire-out", source: { component: "child-not", port: "out" }, target: { component: "child-output", port: "in" } },
          ],
        },
      };
      const hierarchyState = state === "hierarchy-resolved" || state === "hierarchy-unresolved" || [
        "multi-tabs", "multi-tabs-narrow",
        "needs-reload", "unresolved-drill", "internal-signals", "source-return",
      ].includes(state);
      const openPaths = state === "multi-tabs" || state === "multi-tabs-narrow"
        ? [parentPath, peerPath]
        : state === "long-name" ? [longPath] : [parentPath];
      let openPathIndex = 0;
      const simpleProject = (name) => ({
        version: 1,
        circuit: {
          components: [
            { id: `${name}-input`, kind: "input", displayName: "输入", position: { x: 80, y: 180 }, data: { value: "0" } },
            { id: `${name}-output`, kind: "output", displayName: "输出", position: { x: 420, y: 180 } },
          ],
          connections: [{ id: `${name}-wire`, source: { component: `${name}-input`, port: "out" }, target: { component: `${name}-output`, port: "in" } }],
        },
      });
      const response = (value) => Promise.resolve(value);
      window.circuitPlatform = {
        checkEngine: () => state === "engine-unavailable"
          ? response({ status: "unavailable", message: "视觉夹具：引擎不可用" })
          : response({ status: "ok", engine: "Visual test engine" }),
        addComponent: (kind, ports) => {
          if (failAdds) return response({ type: "error", requestId: "visual", code: "visual_add_failed", message: "视觉回归模拟：元件提交失败" });
          const componentId = nextComponentId++;
          // 记下回传的那一份清单：真实引擎的 `component_added` 回传的是它实际建立的端口，
          // 拆线器与合线器的清单因此也在这里进入夹具，后面的读数才拿得到正确的位宽。
          const effective = ports ?? visualPorts[kind] ?? [];
          componentKinds.set(componentId, kind);
          componentPorts.set(componentId, effective);
          return response({ type: "component_added", requestId: "visual", componentId, ports: effective });
        },
        // 改宽整体替换端口清单；夹具只需要协议形状正确，匹配规则由引擎测试负责。
        setPortWidth: (componentId, ports) => {
          componentPorts.set(componentId, ports);
          return response({ type: "port_width_set", requestId: "visual", componentId, ports, danglingConnectionIds: [] });
        },
        addConnection: () => response({ type: "connection_added", requestId: "visual", connectionId: nextConnectionId++ }),
        removeComponent: (componentId) => {
          componentKinds.delete(componentId);
          componentPorts.delete(componentId);
          return response({ type: "component_removed", requestId: "visual", componentId });
        },
        removeConnection: (connectionId) => response({ type: "connection_removed", requestId: "visual", connectionId }),
        setInput: () => response({ type: "input_set", requestId: "visual" }),
        settle: () => response({ type: "settled", requestId: "visual", status: "ok" }),
        // 读数的长度必须等于端口位宽——真实引擎不会返回长度不对的值。位宽为 1 时仍然给 "X"，
        // 既有状态的画面因此不因为多位电路进来而改变；更宽的端口给出一串二进制文本，
        // 多位信号在画布上因此以 `1010` 出现，而不是一整条 X。
        getSignal: (componentId, port) => {
          const spec = (componentPorts.get(componentId) ?? []).find((candidate) => candidate.name === port);
          const width = spec?.width ?? 1;
          const value = width <= 1 ? "X" : "10".repeat(Math.ceil(width / 2)).slice(0, width);
          return response({ type: "signal_result", requestId: "visual", value });
        },
        // 连续运行会反复发 tick；这里只需让每个 tick 带回一份快照，语义仍由引擎测试负责。
        // 每一拍都先挂起、由截图脚本显式放行：运行态与暂停态的画面因此不会因为「捕获时刻差了半拍」而变，
        // 基线仍然可比。放行入口是 `window.__visualAdvanceTick()`。
        tick: () => new Promise((resolve) => {
          pendingTick = () => {
            tickStep += 1;
            // 输出端口从元件自己的端口清单里取，与真实引擎一样不再查一张按类型写死的端口名表。
            const signals = [...componentKinds].flatMap(([componentId, kind]) => {
              const ports = componentPorts.get(componentId) ?? visualPorts[kind] ?? [];
              return ports
                .filter((port) => port.direction === "output")
                .map((port) => ({ componentId, port: port.name, value: "0".repeat(port.width) }));
            });
            resolve({ type: "ticked", requestId: "visual", step: tickStep, signals });
          };
        }),
        // 重置把步数归零；重置语义本身由引擎测试负责，这里只需要协议形状正确。
        reset: () => {
          tickStep = 0;
          return response({ type: "reset_done", requestId: "visual", status: "ok" });
        },
        pickOpenPath: () => {
          const path = openPaths[Math.min(openPathIndex++, openPaths.length - 1)];
          return response({ ok: true, path });
        },
        pickSavePath: () => response({ ok: true, path: "/visual/unnamed-save.circuit.json" }),
        writeProjectFile: () => response({ ok: true }),
        readProjectFile: (filePath) => {
          if (filePath.endsWith("peer.circuit.json")) return response({ ok: true, content: JSON.stringify(simpleProject("peer")) });
          if (filePath.endsWith("this-is-a-deliberately-long-project-file-name-for-tab-overflow.circuit.json")) return response({ ok: true, content: JSON.stringify(simpleProject("long")) });
          if (!hierarchyState) return response({ ok: false, reason: "视觉夹具未启用层次项目" });
          if (filePath.endsWith("child.circuit.json")) {
            if (state === "hierarchy-unresolved" || state === "unresolved-drill") return response({ ok: false, reason: "找不到子电路文件", code: "PROJECT_FILE_NOT_FOUND" });
            return response({ ok: true, content: JSON.stringify(hierarchyChild) });
          }
          return response({ ok: true, content: JSON.stringify(hierarchyParent) });
        },
      };
      await import("/src/main.ts");
      const waitFor = async (selector) => {
        for (let attempt = 0; attempt < 1000; attempt += 1) {
          const element = document.querySelector(selector);
          if (element) return element;
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        return null;
      };
      const click = (element) => {
        if (!element) return;
        if (typeof element.click === "function") element.click();
        else element.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
      };
      const settle = (ms = 40) => new Promise((resolve) => setTimeout(resolve, ms));
      const pointerEvent = (type, x, y, pointerId) => new PointerEvent(type, { bubbles: true, cancelable: true, button: 0, buttons: 1, pointerId, clientX: x, clientY: y });
      const centerOf = (element) => {
        const bounds = element.getBoundingClientRect();
        return { x: bounds.left + bounds.width / 2, y: bounds.top + bounds.height / 2 };
      };
      const nodeByKind = (kindLabel) => [...document.querySelectorAll(".circuit-node")]
        .find((node) => node.querySelector("strong")?.textContent?.trim() === kindLabel);
      /** 把元件库的一项拖到画布上落位，与用户放置元件的路径完全一致。 */
      const dropFromLibrary = async (displayName, xRatio, yRatio) => {
        const item = [...document.querySelectorAll(".component-item")].find((candidate) => candidate.textContent?.includes(displayName));
        if (!item) return;
        const dataTransfer = new DataTransfer();
        item.dispatchEvent(new DragEvent("dragstart", { bubbles: true, dataTransfer }));
        const canvas = await waitFor(".circuit-canvas");
        const bounds = canvas.getBoundingClientRect();
        const clientX = bounds.left + bounds.width * xRatio;
        const clientY = bounds.top + bounds.height * yRatio;
        canvas.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer, clientX, clientY }));
        canvas.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer, clientX, clientY }));
        await settle(80);
      };
      /** 从一个端口起笔、在另一个端口收笔，与用户拖出一条连线的真实路径一致。 */
      const connectPorts = async (sourceNode, sourcePort, targetNode, targetPort) => {
        const canvas = await waitFor(".circuit-canvas");
        const source = sourceNode.querySelector(`[data-port-id="${sourcePort}"]`);
        const target = targetNode.querySelector(`[data-port-id="${targetPort}"]`);
        if (!canvas || !source || !target) return;
        const from = centerOf(source);
        const to = centerOf(target);
        const pointerId = 91;
        source.dispatchEvent(pointerEvent("pointerdown", from.x, from.y, pointerId));
        canvas.dispatchEvent(pointerEvent("pointermove", to.x, to.y, pointerId));
        canvas.dispatchEvent(pointerEvent("pointerup", to.x, to.y, pointerId));
        await settle(60);
      };
      const runControl = (title) => document.querySelector(`[title="${title}"]`);
      const railButton = (label) => document.querySelector(`[aria-label="${label}"]`);
      const inspectorTab = () => [...document.querySelectorAll(".bottom-tabs button")]
        .find((button) => button.textContent?.trim().startsWith("检查器"));
      /**
       * 在检查器里把选中元件的位宽改成新值。
       *
       * 与用户的操作路径完全一致：选中元件、切到「检查器」页签、在第一个可编辑属性的数字框里
       * 改值再提交。位宽是检查器的第一个可编辑属性，改完的清单由引擎回传，前端不内置副本。
       */
      const setSelectedWidth = async (node, width) => {
        click(node);
        await settle(60);
        click(inspectorTab());
        await settle(60);
        const input = await waitFor('.inspector-attributes input[type="number"]');
        if (!input) return;
        input.value = String(width);
        input.dispatchEvent(new Event("change", { bubbles: true }));
        await settle(80);
      };
      /**
       * 等位按钮可用。
       *
       * 位按钮由 `canToggleInput` 决定是否禁用，而它要求引擎绑定已经就绪；画布节点是本地投影，
       * 出现得比引擎绑定早。直接点下去会落在禁用按钮上，静默什么都不做——画面于是停在默认值上，
       * 而截图脚本不会报错。
       */
      const waitForEnabledBit = async (index) => {
        for (let attempt = 0; attempt < 200; attempt += 1) {
          const button = [...document.querySelectorAll(".input-bit")][index];
          if (button && !button.disabled) return button;
          await settle(25);
        }
        return null;
      };
      /** 拨动「输入设置」里第一个 Input 的第 `index` 位：左键切换 0/1，右键设为 X。 */
      const setInputBitByClick = async (index, unknown) => {
        const button = await waitForEnabledBit(index);
        if (!button) return;
        if (unknown) button.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true }));
        else click(button);
        await settle(60);
      };
      /**
       * 从元件库搭一条多位通路：输入(8) → 拆线器 → 合线器 → 输出(8)。
       *
       * Input 与 Output 放下时是 1 位的（内置定义的位宽都是 1），8 位由检查器改出来；
       * 拆线器与合线器的端口清单是数据驱动的，放下就是默认的「8 位拆成八条 1 位分支」。
       */
      const buildBusCircuit = async () => {
        click(document.querySelector('[aria-label="清空画布"]'));
        await waitFor(".confirmation-dialog");
        click(document.querySelector(".confirmation-dialog button:last-child"));
        await settle(80);
        await dropFromLibrary("拆线器", 0.4, 0.34);
        await dropFromLibrary("输入", 0.12, 0.3);
        await dropFromLibrary("合线器", 0.66, 0.34);
        await dropFromLibrary("输出", 0.9, 0.46);
        if (nodeByKind("INPUT")) await setSelectedWidth(nodeByKind("INPUT"), 8);
        if (nodeByKind("OUTPUT")) await setSelectedWidth(nodeByKind("OUTPUT"), 8);
        const splitterNode = nodeByKind("SPLITTER");
        const mergerNode = nodeByKind("MERGER");
        if (nodeByKind("INPUT") && splitterNode) await connectPorts(nodeByKind("INPUT"), "out", splitterNode, "in");
        if (splitterNode && mergerNode) await connectPorts(splitterNode, "out0", mergerNode, "in0");
        if (mergerNode && nodeByKind("OUTPUT")) await connectPorts(mergerNode, "out", nodeByKind("OUTPUT"), "in");
      };
      /** 放行已经挂起的那几拍；连续运行仍由工作区自己排定，这里只决定每一拍何时落地。 */
      const advanceTicks = async (count) => {
        for (let index = 0; index < count; index += 1) {
          for (let attempt = 0; attempt < 200 && !window.__visualTickPending(); attempt += 1) await settle(10);
          window.__visualAdvanceTick();
          await settle(0);
        }
      };
      const prepare = async () => {
        // 首启空状态（#40）本身就是画面：启动不再自动加载示例，其余状态先从空状态面板
        // 显式加载示例，再等电路出现在画布上。
        if (state === "first-start" || state === "first-start-recent") return;
        if (["hierarchy-resolved", "hierarchy-unresolved", "unresolved-drill", "internal-signals", "source-return", "multi-tabs", "multi-tabs-narrow", "needs-reload"].includes(state)) {
          // 通过真实的「打开」入口加载父 Project；桥接返回的子文件是否存在决定两种状态。
          // 首启时顶栏文件按钮尚未启用，真实入口在空状态面板；从这里发起同一个 requestOpen。
          const openProjectButton = await waitFor('.empty-state__actions button:first-child');
          if (!openProjectButton) throw new Error("层次视觉夹具未找到打开 Project 入口");
          click(openProjectButton);
          const hierarchyNode = await waitFor('[data-subcircuit-status]');
          if (!hierarchyNode) throw new Error("层次视觉夹具未完成父 Project 打开");
          click(hierarchyNode);
          await settle(80);
          click(inspectorTab());
          const hierarchyInspector = await waitFor('.inspector-subcircuit');
          if (!hierarchyInspector) throw new Error("层次视觉夹具未打开子电路检查器");
          await settle(80);
          if (state === "unresolved-drill") return;
          if (state === "internal-signals") return;
          if (state === "source-return") {
            click(await waitFor('[aria-label^="打开子电路"]'));
            await waitFor('[title="返回父电路"]');
            return;
          }
          if (state === "needs-reload") {
            // Open the child, make one deterministic input edit, and save it. The
            // parent remains open and receives only the stale/reload marker.
            click(await waitFor('[aria-label^="打开子电路"]'));
            await waitFor('.document-tab');
            click(await waitFor('[aria-label="输入设置"]'));
            const bitButton = await waitFor('.input-bit:not(:disabled)');
            if (bitButton) click(bitButton);
            await settle(80);
            click(await waitFor('[title="保存 (Ctrl/Cmd+S)"]'));
            await settle(100);
            const parentTab = [...document.querySelectorAll('[role="tab"]')].find((tab) => tab.textContent?.includes("parent"));
            if (parentTab) click(parentTab);
            await settle(100);
            const subcircuitNode = await waitFor('[data-subcircuit-status]');
            if (subcircuitNode) click(subcircuitNode);
            await settle(80);
            click(inspectorTab());
            await settle(80);
            return;
          }
          if (state === "multi-tabs" || state === "multi-tabs-narrow") {
            // The parent is clean because it came from a file; opening peer uses
            // the second deterministic path from the same picker seam.
            click(await waitFor('[title="打开 (Ctrl/Cmd+O)"]'));
            await waitFor('[role="tab"]:nth-child(2)');
            await settle(80);
            return;
          }
          return;
        }
        if (state === "engine-unavailable") return;
        if (state === "long-name") {
          const openProjectButton = await waitFor('.empty-state__actions button:first-child');
          click(openProjectButton);
          await waitFor('[role="tab"]');
          await settle(80);
          return;
        }
        if (state === "unnamed-tabs") {
          // 空工作区的顶栏「新建」尚未启用，第一份文档必须走空状态入口；
          // 建立活动文档后，后两份再走用户日常使用的顶栏入口。
          click(await waitFor('.empty-state__actions button:nth-child(2)'));
          await waitFor('.document-tabs [role="tab"]:nth-child(1)');
          for (let index = 2; index <= 3; index += 1) {
            click(await waitFor('[title="新建 (Ctrl/Cmd+N)"]'));
            await waitFor(`.document-tabs [role="tab"]:nth-child(${index})`);
          }
          await settle(80);
          return;
        }
        click(await waitFor('[title="加载示例电路"]'));
        await waitFor(".circuit-node");
        failAdds = state === "error";
        if (state === "unsaved-confirm") {
          // 示例通过多文档 facade 创建普通未保存标签；关闭它应显示目标稳定的确认对话框。
          const closeButton = await waitFor(".document-tab__close");
          if (!closeButton) throw new Error("未保存确认夹具未找到标签关闭按钮");
          click(closeButton);
          const closeDialog = await waitFor(".confirmation-dialog");
          if (!closeDialog) throw new Error(`关闭脏标签后未显示确认对话框；dirty=${Boolean(document.querySelector(".document-tab__dirty"))}`);
          await settle(40);
          return;
        }
        if (state === "selected-component") click(document.querySelector(".circuit-node"));
        if (state === "selected-wire") click(document.querySelector(".signal-wire-hit"));
        if (state === "draft") click(document.querySelector("[data-port-id]"));
        if (state === "pending" || state === "error") {
          click([...document.querySelectorAll(".component-item")].find((item) => item.textContent?.includes("XOR")));
          if (state === "error") {
            const canvas = await waitFor(".circuit-canvas");
            const bounds = canvas.getBoundingClientRect();
            canvas.dispatchEvent(new PointerEvent("pointerdown", {
              bubbles: true,
              button: 0,
              clientX: bounds.left + bounds.width * 0.65,
              clientY: bounds.top + bounds.height * 0.45,
            }));
          }
        }
        if (state === "dangling") {
          click(document.querySelector(".circuit-node"));
          click(await waitFor('[title="删除选中对象 (Delete)"]:not(:disabled)'));
          await waitFor(".dangling-endpoint");
        }
        if (state === "empty") {
          click(document.querySelector('[aria-label="清空画布"]'));
          await waitFor(".confirmation-dialog");
          click(document.querySelector(".confirmation-dialog button:last-child"));
        }
        if (state === "bus-canvas") {
          // 画布上的位区间标注（`out[7:0]`）与逐位二进制文本（`10X00000`）。
          // 激励由「输入设置」里的位按钮真实拨出来，画布读到的就是那次编辑的结果。
          await buildBusCircuit();
          click(railButton("输入设置"));
          await settle(60);
          await setInputBitByClick(0, false);
          await setInputBitByClick(2, true);
          click(railButton("元件库"));
          await settle(60);
        }
        if (state === "bus-inspector") {
          // 检查器把位宽作为第一个可编辑属性：放下一个默认 1 位的 Input，再把它改成 8 位。
          click(document.querySelector('[aria-label="清空画布"]'));
          await waitFor(".confirmation-dialog");
          click(document.querySelector(".confirmation-dialog button:last-child"));
          await settle(80);
          await dropFromLibrary("输入", 0.4, 0.45);
          await setSelectedWidth(nodeByKind("INPUT"), 8);
        }
        if (state === "bus-ranges") {
          // 拆线器的位区间列表同样在检查器里编辑；提交后两条分支变成 `out0[7:4]` 与 `out1[3:0]`。
          click(document.querySelector('[aria-label="清空画布"]'));
          await waitFor(".confirmation-dialog");
          click(document.querySelector(".confirmation-dialog button:last-child"));
          await settle(80);
          await dropFromLibrary("拆线器", 0.45, 0.45);
          click(nodeByKind("SPLITTER"));
          await settle(60);
          click(inspectorTab());
          await settle(60);
          const ranges = await waitFor('.inspector-attributes input[type="text"]');
          if (ranges) {
            ranges.value = "7:4, 3:0";
            ranges.dispatchEvent(new Event("change", { bubbles: true }));
            await settle(80);
          }
        }
        if (state === "bus-bits-expanded" || state === "bus-bits-collapsed") {
          // 按位按钮组：8 位 Input 每行八列，展开与收起都在这里。
          await buildBusCircuit();
          click(railButton("输入设置"));
          await settle(60);
          await setInputBitByClick(1, false);
          await setInputBitByClick(3, true);
          if (state === "bus-bits-collapsed") {
            click(await waitFor(".input-setting-disclosure"));
            await settle(60);
          }
        }
        if (state === "bus-bit-single") {
          // 1 位 Input 与 8 位用同一套视觉：同样是方形按钮，只是每组只有一个。
          click(railButton("输入设置"));
          await settle(60);
          await setInputBitByClick(0, false);
        }
        if (state === "bus-bit-space") {
          // 焦点落在位按钮上的 Space。这是**输入设置**作用域里的按键（ADR 0012 的键位表把它
          // 登记为「切换聚焦位的 0 / 1」），与画布的「布线草稿中切换轴向」同名不同义，因此
          // 必须按焦点所在的作用域分派。夹具只把状态摆好，那一击由探针用真实输入发出。
          await buildBusCircuit();
          click(railButton("输入设置"));
          await settle(60);
        }
        if (state === "running" || state === "paused") {
          // 先清空画布，再从元件库搭出 Clock 驱动 D Flip-Flop，最后按「开始」。
          click(document.querySelector('[aria-label="清空画布"]'));
          await waitFor(".confirmation-dialog");
          click(document.querySelector(".confirmation-dialog button:last-child"));
          await settle(80);
          await dropFromLibrary("Clock", 0.3, 0.36);
          await dropFromLibrary("D Flip-Flop", 0.64, 0.4);
          await dropFromLibrary("输入", 0.3, 0.74);
          const clockNode = nodeByKind("CLOCK");
          const flipFlopNode = nodeByKind("D_FLIP_FLOP");
          const inputNode = nodeByKind("INPUT");
          if (clockNode && flipFlopNode) await connectPorts(clockNode, "out", flipFlopNode, "clock");
          if (inputNode && flipFlopNode) await connectPorts(inputNode, "out", flipFlopNode, "d");
          click(runControl("开始连续运行 (F5)"));
          await settle(20);
          // 运行态停在已推进若干拍的画面上；暂停态停在刚开跑、还没落地的那一拍上。
          if (state === "paused") {
            click(runControl("暂停连续运行 (F6)"));
          } else {
            await advanceTicks(3);
          }
        }
        await new Promise((resolve) => setTimeout(resolve, 120));
      };
      window.__visualTickPending = () => pendingTick !== null;
      window.__visualAdvanceTick = () => {
        const run = pendingTick;
        pendingTick = null;
        if (run) run();
      };
      // 截图脚本按这个标志等待状态真正就位：准备一段状态要跑好几步真实交互，
      // 早于它取图会拍到中间画面（例如元件已经放下、连线还没拉的那一帧）。
      try {
        await prepare();
      } catch (error) {
        window.__visualError = error instanceof Error ? error.stack ?? error.message : String(error);
      }
      window.__visualReady = true;
    </script>
  </body>
</html>
