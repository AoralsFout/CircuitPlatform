<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>Canvas performance benchmark</title></head>
<body><div id="app"></div>
<style>
  .benchmark-document--inactive { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
</style>
<script type="module">
  // 性能基准挂载真实 CircuitCanvas，并按 useEditorState 的同一条路径投影场景：
  // EditorSnapshot + 交互预览 → createCanvasSceneProjector → CircuitCanvas。
  // 交互状态由真实 DOM PointerEvent 驱动，不直接改写场景几何。
  import { createApp, computed, h, nextTick, ref } from "vue";
  import CircuitCanvas from "/src/components/CircuitCanvas.vue";
  import {
    componentGeometryFor,
    createCanvasSceneProjector,
    createComponentDefinitionRegistry,
    createFrameCoalescer,
    portLayoutFor,
  } from "/src/canvas/index.ts";
  import { createRouteEditController } from "/src/canvas/route-edit.ts";
  import { createConnectionDraft, connectionDraftRoute, reduceConnectionDraft } from "/src/editor/connection-draft.ts";
  import { positionFromPlacementCenter } from "/src/editor/placement.ts";
  import { createDefaultOrthogonalRoute } from "/src/editor/route.ts";
  import { flattenProjectHierarchy } from "/src/project-file/hierarchy.ts";
  import { createHierarchyPerformanceFixture } from "/src/project-file/performance-fixture.ts";
  // 这一页不连引擎，端口清单必须有个本地来源。它扮演的就是引擎，因此用的正是假引擎那份内置
  // 定义——前端源码里不该再有第二份，端口清单的唯一权威来源是引擎（ADR 0020）。
  // 本页不进入生产构建（`vite build` 只出 index.html），因此引入测试夹不会把 tests/ 带进产品。
  import { BUILT_IN_PORTS } from "/tests/fake-ports.ts";

  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "pan";
  const expectedComponents = Number(params.get("components") || 500);
  const expectedWires = Number(params.get("wires") || 1000);
  const documentCount = Math.max(1, Number(params.get("documents") || 1));
  const registry = createComponentDefinitionRegistry();
  const projector = createCanvasSceneProjector(registry);

  // 端口位宽默认 1（与既有基线逐像素一致）；`--width=8` 把每个端口都变成多位总线，
  // 用来量多位电路的成本——位区间标注与二进制信号文本比 1 位端口更长，是唯一随位宽变化的
  // 渲染成本（线路外观不随位宽改变，ADR 0013）。
  const busWidth = Math.max(1, Number(params.get("width") || 1));
  const portsForKind = (kind) =>
    busWidth > 1 ? BUILT_IN_PORTS[kind].map((port) => ({ ...port, width: busWidth })) : BUILT_IN_PORTS[kind];

  // 基准必须先走生产层次展平器，再将其 flat Circuit 投影到 Canvas；这里不接受合成平面数组。
  const fixture = createHierarchyPerformanceFixture();
  const hierarchy = await flattenProjectHierarchy({
    rootIdentity: fixture.rootIdentity,
    root: fixture.root,
    platform: "posix",
    reader: {
      read: async (identity) => {
        const value = fixture.files.get(identity);
        return value === undefined
          ? { ok: false, code: "project-read-failed", message: `性能夹具缺少 Project：${identity}` }
          : { ok: true, value };
      },
    },
  });
  const flattenedComponents = hierarchy.circuit.components.length;
  const flattenedWires = hierarchy.circuit.connections.length;
  if (hierarchy.diagnostics.length > 0) throw new Error(`层次性能夹具解析失败：${hierarchy.diagnostics[0].message}`);
  if (flattenedComponents !== expectedComponents || flattenedWires !== expectedWires) {
    throw new Error(`层次性能夹具规模错误：${flattenedComponents}/${flattenedWires}，预期 ${expectedComponents}/${expectedWires}`);
  }
  const count = flattenedComponents;
  const wireCount = flattenedWires;
  const components = hierarchy.circuit.components.map((component, index) => {
    const kind = component.kind;
    return {
      id: component.id,
      kind,
      displayName: component.id,
      position: { x: 32 + (index % 25) * 74, y: 32 + Math.floor(index / 25) * 58 },
      lifecycle: "active",
      // 端口清单不再来自展示定义：展示定义只有元数据，端口由引擎回传（ADR 0020）。这一页
      // 不连引擎，因此由它自己的引擎替身给出，与真实引擎的回退规则同源。
      ports: component.ports ?? portsForKind(kind),
    };
  });
  /**
   * 一个端口相对元件左上角的偏移。
   *
   * 用投影器自己的排布规则算，不另抄一份几何：端口画在哪由 `componentGeometryFor` 与
   * `portLayoutFor` 决定，基准若自己算一套，连线端点迟早会与端口错位。
   */
  const portOffsetFor = (component, port, side) => {
    const definition = registry.get(component.kind);
    const geometry = componentGeometryFor(definition, component.ports);
    const layout = portLayoutFor(definition, port.name, port.direction, side.indexOf(port), side.length, geometry);
    return layout.offset;
  };
  const portPoint = (component, direction) => {
    const ports = component.ports;
    // 优先取该方向的端口；没有时退回第一个，保持展平夹具端点几何的稳定性。
    const port = ports.find((candidate) => candidate.direction === direction) ?? ports[0];
    const side = ports.filter((candidate) => candidate.direction === port.direction);
    const offset = portOffsetFor(component, port, side);
    return { port, point: { x: component.position.x + offset.x, y: component.position.y + offset.y } };
  };
  const componentsById = new Map(components.map((component) => [component.id, component]));
  const connections = hierarchy.circuit.connections.map((connection) => {
    const source = componentsById.get(connection.source.componentId);
    const target = componentsById.get(connection.target.componentId);
    if (source === undefined || target === undefined) throw new Error(`层次性能夹具端点缺失：${connection.id}`);
    const from = portPoint(source, "output");
    const to = portPoint(target, "input");
    return {
      id: connection.id,
      source: { componentId: source.id, port: connection.source.port, point: from.point },
      target: { componentId: target.id, port: connection.target.port, point: to.point },
      lifecycle: "visible",
      danglingEndpoints: [],
      route: createDefaultOrthogonalRoute(from.point, to.point),
    };
  });

  // route 模式需要一条已选中且带折点的 Wire，Canvas 才会渲染折点手柄。
  const snapshot = ref({
    document: { components, connections },
    selection: mode === "route" ? { kind: "connection", id: connections[0]?.id ?? "" } : null,
    operation: "idle",
    canUndo: false,
    canRedo: false,
    confirmation: null,
    error: null,
  });
  const simulation = { signals: {} };
  const viewport = ref({ x: 0, y: 0, zoom: 1, visibleRect: { width: 1920, height: 1080 } });

  const draggingComponentId = ref(null);
  const dragPreview = ref(null);
  const dragCoalescer = createFrameCoalescer((preview) => { dragPreview.value = preview; });

  const pendingPlacement = ref(null);
  const placementDefinition = registry.get("and");

  const draft = ref(createConnectionDraft());
  const draftCoalescer = createFrameCoalescer(({ point, altKey }) => {
    draft.value = reduceConnectionDraft(draft.value, { type: "move", point, altKey });
  });

  const routeEditPreview = ref(null);
  const routeEditController = createRouteEditController({
    onPreview: (preview) => { routeEditPreview.value = preview; },
    onCommit: () => {},
    onCancel: () => { routeEditPreview.value = null; },
  });

  const previewPositions = computed(() => dragPreview.value ? { [dragPreview.value.componentId]: dragPreview.value.position } : {});
  const previewRoutes = computed(() => routeEditPreview.value ? { [routeEditPreview.value.connectionId]: routeEditPreview.value.route } : undefined);
  const scene = computed(() => projector.project(snapshot.value, simulation, previewPositions.value, previewRoutes.value));
  // Inactive document views stay mounted to represent open tabs, but receive a
  // frozen scene and never subscribe to the active interaction refs. This makes
  // inactiveWork an observable metric instead of hiding the extra documents by
  // skipping their construction entirely.
  const inactiveScene = projector.project(snapshot.value, simulation, {}, undefined);
  let inactiveFrameUpdates = 0;
  let internalSignalMode = "hidden";
  let internalSignalRevision = 0;
  let internalSignalReads = 0;
  let internalSignalStaleResultsDropped = 0;

  const interaction = computed(() => ({
    focusedId: null,
    draggingComponentId: draggingComponentId.value,
    dragPreview: dragPreview.value,
    connectionDraft: draft.value.origin ? connectionDraftRoute(draft.value) : null,
    routeEditPreview: routeEditPreview.value,
    pendingPlacement: pendingPlacement.value
      ? {
          kind: pendingPlacement.value.kind,
          position: positionFromPlacementCenter(pendingPlacement.value.center, placementDefinition.size, pendingPlacement.value.altKey),
          size: placementDefinition.size,
          error: null,
        }
      : null,
  }));

  const controller = {
    componentDefinitions: registry.list(),
    recentComponentKinds: [],
    addComponent: async () => false,
    rememberComponentKind: () => undefined,
    duplicateComponent: async () => false,
    deleteComponent: async () => undefined,
    resetRoute: async () => undefined,
    setWireColor: async () => undefined,
    deleteWaypoint: async () => undefined,
    deleteConnection: async () => undefined,
  };

  // 基准 runner 用它把「状态更新 → Vue 完成渲染」纳入同一帧的计时。
  window.__flush = () => nextTick();
  window.__resetInternalSignalMetrics = () => {
    internalSignalRevision += 1;
    internalSignalReads = 0;
    internalSignalStaleResultsDropped = 0;
  };
  window.__setInternalSignalMode = (next) => {
    internalSignalMode = next;
    internalSignalRevision += 1;
  };
  window.__driveInternalSignalFrame = () => {
    if (internalSignalMode === "hidden") return;
    const revision = ++internalSignalRevision;
    if (internalSignalMode === "rapid-selection") {
      Promise.resolve().then(() => {
        if (revision === internalSignalRevision) internalSignalReads += 1;
        else internalSignalStaleResultsDropped += 1;
      });
      return;
    }
    // Visible reads are queued after the frame's model update. They are small
    // deterministic fixture reads and therefore cannot extend the frame sample.
    queueMicrotask(() => { internalSignalReads += 1; });
  };
  window.__internalSignalMetrics = () => ({
    mode: internalSignalMode,
    reads: internalSignalReads,
    staleResultsDropped: internalSignalStaleResultsDropped,
  });
  // 基准 runner 用它确认交互真的发生了；只测到空转的基准必须失败而不是给出好看的数字。
  window.__benchmarkState = () => ({
    sceneNodes: scene.value.nodes.length,
    sceneWires: scene.value.wires.length,
    visibleComponents: count,
    visibleWires: wireCount,
    flattenedComponents,
    flattenedWires,
    documentCount,
    inactiveWork: inactiveFrameUpdates,
    hierarchyFixture: true,
    hierarchyDiagnostics: hierarchy.diagnostics.length,
    elements: document.querySelectorAll("*").length,
    animated: document.querySelectorAll("animate").length,
    viewport: { x: viewport.value.x, y: viewport.value.y },
    placementCenter: pendingPlacement.value ? { ...pendingPlacement.value.center } : null,
    draftPoints: draft.value.origin ? connectionDraftRoute(draft.value).length : 0,
    dragPreview: dragPreview.value ? { ...dragPreview.value.position } : null,
    routeEditPoints: routeEditPreview.value ? routeEditPreview.value.route.length : 0,
  });

  const canvasProps = (index) => ({
    scene: index === 0 ? scene.value : inactiveScene,
    viewport: index === 0 ? viewport.value : { x: 0, y: 0, zoom: 1, visibleRect: { width: 1920, height: 1080 } },
    interaction: index === 0 ? interaction.value : {
      focusedId: null, draggingComponentId: null, dragPreview: null, connectionDraft: null,
      routeEditPreview: null, pendingPlacement: null,
    },
    controller,
    onViewportChange: index === 0 ? (next) => { viewport.value = next; } : () => undefined,
    onNodeDragStart: index === 0 ? ({ nodeId }) => { draggingComponentId.value = nodeId; } : () => undefined,
    onNodeDragMove: index === 0 ? ({ pointerWorld }) => { dragCoalescer.schedule({ componentId: draggingComponentId.value, position: pointerWorld }); } : () => undefined,
    onNodeDragEnd: index === 0 ? () => { draggingComponentId.value = null; dragPreview.value = null; } : () => undefined,
    onNodeDragCancel: index === 0 ? () => { draggingComponentId.value = null; dragPreview.value = null; } : () => undefined,
    onPlacementMove: index === 0 ? (center, altKey) => { pendingPlacement.value = { kind: "and", center, altKey }; } : () => undefined,
    onConnectionStart: index === 0 ? (port) => { draft.value = reduceConnectionDraft(draft.value, { type: "start", port }); } : () => undefined,
    onConnectionMove: index === 0 ? ({ point, altKey }) => { draftCoalescer.schedule({ point, altKey }); } : () => undefined,
    onConnectionEnd: index === 0 ? (port) => { draft.value = reduceConnectionDraft(draft.value, { type: "end", port }); } : () => undefined,
    onConnectionCancel: index === 0 ? () => { draftCoalescer.cancel(); draft.value = createConnectionDraft(); } : () => undefined,
    onRouteEditStart: index === 0 ? ({ connectionId, route, target, pointerWorld }) => { routeEditController.start(connectionId, route, target, pointerWorld); } : () => undefined,
    onRouteEditMove: index === 0 ? ({ pointerWorld, altKey }) => { routeEditController.move(pointerWorld, altKey); } : () => undefined,
    onRouteEditEnd: index === 0 ? () => { routeEditController.end(); } : () => undefined,
    onRouteEditCancel: index === 0 ? () => { routeEditController.cancel(); } : () => undefined,
  });
  createApp({
    setup: () => () => h("div", { class: "benchmark-documents", "data-document-count": documentCount },
      Array.from({ length: documentCount }, (_, index) => h("div", {
        class: index === 0 ? "benchmark-document benchmark-document--active" : "benchmark-document benchmark-document--inactive",
        "data-document-index": index,
      }, [h(CircuitCanvas, canvasProps(index))]))),
  }).mount("#app");

  // route / place 模式需要一个已激活的交互起点，否则 Canvas 不会派发 Move 事件。
  if (mode === "place") pendingPlacement.value = { kind: "and", center: { x: 200, y: 200 }, altKey: false };
  window.__benchmarkReady = true;
</script></body></html>
