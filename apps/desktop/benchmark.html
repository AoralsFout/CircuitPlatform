<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>Canvas performance benchmark</title></head>
<body><div id="app"></div>
<style>.benchmark-document--inactive { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }</style>
<script type="module">
  // 这条基准挂载生产 useDocumentWorkspace：每个标签都创建独立的 useWorkspace、EditorSession、
  // 队列和 scheduler。Fake EngineAdapter 只替代 C++ 边界，所有组合层、队列、刷新和 revision
  // 丢弃逻辑仍然走生产实现；画布事件仍由真实 DOM PointerEvent 驱动。
  import { createApp, h, nextTick } from "vue";
  import CircuitCanvas from "/src/components/CircuitCanvas.vue";
  import { useDocumentWorkspace } from "/src/composables/useDocumentWorkspace.ts";
  import { BUILT_IN_PORTS } from "/tests/fake-ports.ts";
  import { flattenProjectHierarchy } from "/src/project-file/hierarchy.ts";
  import { createHierarchyPerformanceFixture } from "/src/project-file/performance-fixture.ts";

  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "pan";
  const expectedComponents = Number(params.get("components") || 500);
  const expectedWires = Number(params.get("wires") || 1000);
  const documentCount = Math.max(1, Number(params.get("documents") || 1));
  const busWidth = Math.max(1, Number(params.get("width") || 1));
  const fixture = createHierarchyPerformanceFixture();
  const hierarchy = await flattenProjectHierarchy({
    rootIdentity: fixture.rootIdentity,
    root: fixture.root,
    platform: "posix",
    reader: { read: async (identity) => {
      const name = identity.slice(identity.lastIndexOf("/") + 1);
      const value = name === "budget-root.circuit.json" ? (mode === "internal-signals" ? fixture.root : flatFixture) : fixture.files.get(`/benchmark/${name}`);
      return value === undefined
        ? { ok: false, code: "project-read-failed", message: `性能夹具缺少 Project：${identity}` }
        : { ok: true, value };
    } },
  });
  const flattenedComponents = hierarchy.circuit.components.length;
  const flattenedWires = hierarchy.circuit.connections.length;
  if (hierarchy.diagnostics.length > 0) throw new Error(`层次性能夹具解析失败：${hierarchy.diagnostics[0].message}`);
  if (flattenedComponents !== expectedComponents || flattenedWires !== expectedWires) {
    throw new Error(`层次性能夹具规模错误：${flattenedComponents}/${flattenedWires}，预期 ${expectedComponents}/${expectedWires}`);
  }
  // 生产打开路径仍负责解析/校验/推送；交互模式把同一份生产展平结果作为顶层 Project，
  // 这样生产 EditorSession/Canvas 也确实拥有 500/1,000 个可命中的实体。内部信号模式保留
  // 原始层次 Project，以验证 occurrence-local 读取和 revision 丢弃。
  const flatFixture = {
    version: 1,
    circuit: {
      components: hierarchy.circuit.components.map((component, index) => ({
        id: component.id,
        kind: component.kind,
        displayName: component.id,
        position: { x: 32 + (index % 25) * 74, y: 32 + Math.floor(index / 25) * 58 },
        ...(component.ports ? { ports: component.ports } : {}),
      })),
      connections: hierarchy.circuit.connections.map((connection) => ({
        id: connection.id,
        source: { component: connection.source.componentId, port: connection.source.port },
        target: { component: connection.target.componentId, port: connection.target.port },
      })),
    },
  };

  const adapters = new Map();
  const schedulers = new Map();
  const rootPaths = Array.from({ length: documentCount }, (_, index) => `/benchmark/doc-${index}/budget-root.circuit.json`);
  const portsFor = (kind, requested) => (requested ?? BUILT_IN_PORTS[kind]).map((port) => busWidth > 1 ? { ...port, width: busWidth } : { ...port });
  function createManualScheduler(metrics) {
    const pending = new Set();
    return {
      schedule(_delayMs, run) { pending.add(run); return () => pending.delete(run); },
      async flush() { const runs = [...pending]; pending.clear(); for (const run of runs) { metrics.schedulerRuns += 1; run(); } await Promise.resolve(); await Promise.resolve(); },
      pending,
    };
  }
  function adapterFor(documentKey) {
    let adapter = adapters.get(documentKey);
    if (adapter) return adapter;
    const metrics = { work: 0, schedulerRuns: 0, refreshes: 0, frameWork: 0, getSignalCalls: 0 };
    let nextComponent = 1;
    let nextConnection = 1;
    let nextSignalGate = null;
    const response = (type, value = {}) => ({ type, requestId: `benchmark-${documentKey}`, ...value });
    adapter = {
      metrics,
      blockNextSignal() { return new Promise((resolve) => { nextSignalGate = resolve; }); },
      checkEngine: async () => ({ status: "ok", engine: "fake-cpp-boundary", processEpoch: 1 }),
      addComponent: async (kind, ports) => { metrics.work += 1; return response("component_added", { componentId: nextComponent++, ports: portsFor(kind, ports) }); },
      setPortWidth: async (_componentId, ports) => { metrics.work += 1; return response("port_width_set", { componentId: 0, ports, danglingConnectionIds: [] }); },
      addConnection: async () => { metrics.work += 1; return response("connection_added", { connectionId: nextConnection++ }); },
      removeComponent: async (componentId) => { metrics.work += 1; return response("component_removed", { componentId }); },
      removeConnection: async (connectionId) => { metrics.work += 1; return response("connection_removed", { connectionId }); },
      setInput: async () => { metrics.work += 1; return response("input_set"); },
      settle: async () => { metrics.work += 1; metrics.refreshes += 1; return response("settled", { status: "ok" }); },
      tick: async () => { metrics.work += 1; metrics.frameWork += 1; return response("ticked", { step: metrics.frameWork, signals: [] }); },
      reset: async () => { metrics.work += 1; return response("reset_done"); },
      getSignal: async () => {
        metrics.work += 1; metrics.getSignalCalls += 1;
        if (nextSignalGate) {
          const release = nextSignalGate;
          nextSignalGate = null;
          await new Promise((resolve) => { release(() => resolve()); });
        }
        return response("signal_result", { value: "0" });
      },
      closeDocument: async () => ({ ok: true }),
    };
    adapters.set(documentKey, adapter);
    return adapter;
  }
  // 文件 IO 仍由生产 openProjectFromPath / flattenProjectHierarchy 完成；每个别名只保证路径身份独立。
  window.circuitPlatform = {
    ...adapterFor("legacy"),
    forDocument: (documentKey) => adapterFor(documentKey),
    readProjectFile: async (path) => {
      const name = path.slice(path.lastIndexOf("/") + 1);
      const value = name === "budget-root.circuit.json" ? (mode === "internal-signals" ? fixture.root : flatFixture) : fixture.files.get(`/benchmark/${name}`);
      return value === undefined ? { ok: false, reason: "性能夹具缺少 Project", code: "PROJECT_FILE_NOT_FOUND" } : { ok: true, content: JSON.stringify(value) };
    },
    writeProjectFile: async () => ({ ok: true }),
    pickOpenPath: async () => ({ ok: false, reason: "canceled" }),
    pickSavePath: async () => ({ ok: false, reason: "canceled" }),
  };
  const workspace = useDocumentWorkspace({ schedulerFactory: (key) => {
    const scheduler = createManualScheduler(adapterFor(key).metrics); schedulers.set(key, scheduler); return scheduler;
  } });
  for (const path of rootPaths) {
    await workspace.requestOpenRecent(path);
    if (workspace.openError.value) throw new Error(workspace.openError.value);
  }
  // 加载成本不属于交互样本；之后的 inactiveWork 只来自真实 scheduler/refresh/tick/get_signal。
  for (const adapter of adapters.values()) Object.assign(adapter.metrics, { work: 0, schedulerRuns: 0, refreshes: 0, frameWork: 0, getSignalCalls: 0 });
  const activeKey = () => workspace.activeDocumentKey.value;
  const activeAdapter = () => adapters.get(activeKey());
  const activeScheduler = () => schedulers.get(activeKey());
  const activeEditor = workspace.editor;
  const controller = {
    get componentDefinitions() { return activeEditor.componentDefinitions.value; },
    get recentComponentKinds() { return activeEditor.recentComponentKinds.value; },
    addComponent: (kind, center, altKey, continuous) => workspace.addComponent(kind, center, altKey, continuous),
    rememberComponentKind: (kind) => activeEditor.rememberComponentKind(kind),
    duplicateComponent: (id) => workspace.duplicateComponent(id),
    deleteComponent: (id) => workspace.deleteComponent(id),
    resetRoute: (id) => workspace.resetRoute(id),
    setWireColor: (id, color) => workspace.setWireColor(id, color),
    deleteWaypoint: (id, index) => workspace.deleteWaypoint(id, index),
    deleteConnection: (id) => workspace.deleteConnection(id),
  };
  let internalMode = "hidden";
  let staleResultsDropped = 0;
  const sceneState = () => activeEditor.canvasScene.value;
  window.__flush = () => nextTick();
  window.__resetInternalSignalMetrics = () => { staleResultsDropped = 0; activeAdapter().metrics.getSignalCalls = 0; };
  window.__setInternalSignalMode = (next) => { internalMode = next; workspace.setInternalSignalTableVisible(next !== "hidden"); };
  window.__driveInternalSignalFrame = async () => {
    if (internalMode === "hidden") { workspace.setInternalSignalTableVisible(false); return; }
    if (internalMode === "rapid-selection") {
      const before = JSON.stringify(workspace.state.value.internalSignals);
      const blocked = activeAdapter().blockNextSignal();
      workspace.setInternalSignalTableVisible(true);
      await Promise.resolve();
      workspace.setInternalSignalTableVisible(false);
      const release = await blocked;
      release();
      await Promise.resolve(); await Promise.resolve();
      if (JSON.stringify(workspace.state.value.internalSignals) === before) staleResultsDropped += 1;
      workspace.setInternalSignalTableVisible(true);
      return;
    }
    workspace.setInternalSignalTableVisible(true);
    if (internalMode === "continuous-run") { await workspace.start(); await activeScheduler().flush(); }
    await Promise.resolve(); await Promise.resolve();
  };
  window.__internalSignalMetrics = () => ({ mode: internalMode, reads: activeAdapter().metrics.getSignalCalls, staleResultsDropped });
  window.__benchmarkState = () => {
    const scene = sceneState();
    const viewport = activeEditor.viewport.value;
    const dragPreview = activeEditor.interaction.value.dragPreview;
    const inactiveWork = [...adapters.entries()].filter(([key]) => key !== activeKey())
      .reduce((total, [, adapter]) => total + adapter.metrics.work + adapter.metrics.schedulerRuns + adapter.metrics.refreshes + adapter.metrics.frameWork, 0);
    return {
      sceneNodes: scene.nodes.length, sceneWires: scene.wires.length,
      visibleComponents: scene.nodes.length, visibleWires: scene.wires.length,
      flattenedComponents, flattenedWires, documentCount, inactiveWork,
      runtimeAdapterCount: [...adapters.keys()].filter((key) => key.startsWith("document-")).length,
      runtimeAdapterKeys: [...adapters.keys()].filter((key) => key.startsWith("document-")).sort(),
      hierarchyFixture: true, hierarchyDiagnostics: hierarchy.diagnostics.length,
      elements: document.querySelectorAll("*").length, animated: document.querySelectorAll("animate").length,
      viewport: { x: viewport.x, y: viewport.y, zoom: viewport.zoom, visibleRect: { ...viewport.visibleRect } },
      placementCenter: workspace.editor.interaction.value.pendingPlacement ? { ...workspace.editor.interaction.value.pendingPlacement.position } : null,
      draftPoints: workspace.editor.interaction.value.connectionDraft?.length ?? 0,
      dragPreview: dragPreview ? { componentId: dragPreview.componentId, position: { ...dragPreview.position } } : null,
      routeEditPoints: workspace.editor.interaction.value.routeEditPreview?.route.length ?? 0,
    };
  };
  const activeCanvasProps = () => ({
    scene: sceneState(), viewport: activeEditor.viewport.value, interaction: activeEditor.interaction.value, controller,
    onViewportChange: (next) => activeEditor.setViewport(next),
    onNodeDragStart: ({ nodeId, pointerWorld }) => activeEditor.startNodeDrag(nodeId, pointerWorld),
    onNodeDragMove: ({ pointerWorld, altKey }) => activeEditor.moveNodeDrag(pointerWorld, altKey),
    onNodeDragEnd: () => activeEditor.endNodeDrag(), onNodeDragCancel: () => activeEditor.cancelNodeDrag(),
    onPlacementMove: (center, altKey) => activeEditor.placementMoved(center, altKey),
    onConnectionStart: (port) => activeEditor.startConnection(port),
    onConnectionMove: ({ point, altKey }) => activeEditor.moveConnection(point, altKey),
    onConnectionEnd: (port) => activeEditor.finishConnection(port), onConnectionCancel: () => activeEditor.cancelConnection(),
    onRouteEditStart: ({ connectionId, route, target, pointerWorld }) => activeEditor.startRouteEdit(connectionId, route, target, pointerWorld),
    onRouteEditMove: ({ pointerWorld, altKey }) => activeEditor.moveRouteEdit(pointerWorld, altKey),
    onRouteEditEnd: () => activeEditor.endRouteEdit(), onRouteEditCancel: () => activeEditor.cancelRouteEdit(),
  });
  createApp({ setup: () => () => h("div", { class: "benchmark-documents", "data-document-count": documentCount },
    Array.from({ length: documentCount }, (_, index) => h("div", {
      class: index === documentCount - 1 ? "benchmark-document benchmark-document--active" : "benchmark-document benchmark-document--inactive",
      "data-document-index": index,
    }, index === documentCount - 1 ? [h(CircuitCanvas, activeCanvasProps())] : []))),
  }).mount("#app");
  if (mode === "internal-signals") await workspace.select({ kind: "component", id: "wrapper" });
  if (mode === "route") await workspace.editor.selectConnection("source-to-wrapper");
  if (mode === "place") await workspace.beginPlacement("and");
  await nextTick();
  window.__benchmarkReady = true;
</script></body></html>
